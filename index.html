<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ma collection</title>
</head>
<body>
<h1>Ma collection</h1>
<p>Bienvenue dans ma collection personnelle.</p>
<div id="collection">Chargement de ma collection...</div>
<script>
fetch("collection-recap.csv")
.then(response => response.text())
.then(data => {
const lignes = data.split(/\r?\n/).slice(2, 7);
let affichage = "<h2>Mes 5 premiers éléments</h2>";
lignes.forEach(ligne => {
const artiste = ligne.split(",")[0];
const titreTrouve = ligne.match(/^([^,]*),(?:"([^"]*)"|([^,]*))/);
const titre = titreTrouve ? (titreTrouve[2] || titreTrouve[3]) : "";
const statut = ligne.includes("✅ *2") ? "✅ 2 exemplaires" : ligne.includes("✅") ? "✅ Dans ma collection" : ligne.includes("❌") ? "❌ Recherché" : "";
affichage += "<hr><h3>" + artiste + "</h3>";
affichage += "<p><strong>" + titre + "</strong></p>";
affichage += "<p>" + statut + "</p>";
});  
document.getElementById("collection").innerHTML = affichage;
})
.catch(error => {
document.getElementById("collection").innerHTML = "❌ Impossible de lire la collection.";
});
</script>  
</body>
</html>
