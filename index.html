<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ma collection</title>
</head>
<body>
<h1>Ma collection</h1>
<p>Bienvenue dans ma collection personnelle.</p>
<div id="collection">Chargement de ma collection...</div>
<script>
function lireCSV(texte) {
const lignes = [];
let ligne = [];
let cellule = "";
let guillemets = false;
for (let i = 0; i < texte.length; i++) {
const caractere = texte[i];
if (caractere === '"') {
if (guillemets && texte[i + 1] === '"') {
cellule += '"';
i++;
} else {
guillemets = !guillemets;
}
} else if (caractere === "," && !guillemets) {
ligne.push(cellule);
cellule = "";
} else if ((caractere === "\n" || caractere === "\r") && !guillemets) {
if (caractere === "\r" && texte[i + 1] === "\n") i++;
ligne.push(cellule);
if (ligne.some(valeur => valeur !== "")) lignes.push(ligne);
ligne = [];
cellule = "";
} else {
cellule += caractere;
}  
}
if (cellule !== "" || ligne.length > 0) {
ligne.push(cellule);
lignes.push(ligne);
}
return lignes;
}
fetch("collection-recap.csv")
.then(response => response.text())
.then(texte => {
const lignes = lireCSV(texte);
const entetes = lignes[0];
const donnees = lignes.slice(1, 6);
const formats = ["Vinyle 33 tours", "CD\nAlbum", "Vinyle 45 tours", "Single", "DVD", "Livres", "Magazine", "Autres format"];
let affichage = "<h2>Mes 5 premiers éléments</h2>";
donnees.forEach(element => {
const artiste = element[0] || "";
const titre = element[1] || "";
let detailsFormats = [];
formats.forEach(format => {
const position = entetes.indexOf(format);
if (position !== -1 && element[position]) {  
detailsFormats.push(format.replace("\n", " ") + " : " + element[position]);
}
});
const observation = element[10] || "";
affichage += "<hr>";
affichage += "<h3>" + artiste + "</h3>";
affichage += "<p><strong>" + titre + "</strong></p>";
detailsFormats.forEach(detail => { affichage += "<p>" + detail + "</p>"; });
if (observation) affichage += "<p>📝 " + observation + "</p>";  
});
document.getElementById("collection").innerHTML = affichage;
})
.catch(error => {
document.getElementById("collection").innerHTML = "❌ Impossible de lire la collection.";
});  
/script>
</body>
</html>
