<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ma collection</title>
</head>
<body>
<h1>Ma collection</h1>
<p>Bienvenue dans ma collection personnelle.</p>
<div id="collection">Chargement de ma collection...</div>
<script>
function lireCSV(texte) {
const lignes = [];
let ligne = [];
let cellule = "";
let guillemets = false;
for (let i = 0; i < texte.length; i++) {
const caractere = texte[i];
if (caractere === '"') {
if (guillemets && texte[i + 1] === '"') {
cellule += '"';
i++;
} else {
guillemets = !guillemets;
}
} else if (caractere === "," && !guillemets) {
ligne.push(cellule);
cellule = "";
} else if ((caractere === "\n" || caractere === "\r") && !guillemets) {
if (caractere === "\r" && texte[i + 1] === "\n") i++;
ligne.push(cellule);
if (ligne.some(valeur => valeur !== "")) lignes.push(ligne);
ligne = [];
cellule = "";
} else {
cellule += caractere;
}  
}
if (cellule !== "" || ligne.length > 0) {
ligne.push(cellule);
lignes.push(ligne);
}
return lignes;
}
/script>
</body>
</html>
