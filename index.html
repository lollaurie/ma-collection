<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma collection</title>
</head>
<body>
<h1>Ma collection</h1>
<p>Bienvenue dans ma collection personnelle.</p>
<h2>Mes 5 premiers éléments</h2>
<div id="collection">Chargement...</div>
<script>
fetch("collection-recap.csv")
.then(response => response.text())
.then(data => {
const lignes = data.split(/\r?\n/);
const collection = document.getElementById("collection");
collection.innerHTML = "";
lignes.slice(1, 6).forEach(ligne => {
const colonnes = ligne.split(",");
const artiste = colonnes[0];
const titre = colonnes[1];
let type = "";
if (colonnes[2]) type += "💿 Vinyle 33 tours ";
if (colonnes[3]) type += "💿 CD / Album ";
if (colonnes[4]) type += "💿 Vinyle 45 tours ";
if (colonnes[5]) type += "🎵 Single ";
if (colonnes[6]) type += "🎬 DVD ";
if (colonnes[7]) type += "📚 Livre ";
if (colonnes[8]) type += "📰 Magazine ";
if (colonnes[9]) type += "📦 Autre format ";
collection.innerHTML += "<hr><h3>" + artiste + "</h3><h4>" + titre + "</h4><p>" + type + "</p><p>✅ Dans ma collection</p>";
});
})
.catch(error => {
document.getElementById("collection").innerHTML = "❌ Impossible de charger la collection.";
});
</script>
</body>
</html>
